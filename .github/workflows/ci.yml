name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - run: rustup default 1.97.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  source-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 tools/check_docs.py
      - run: python3 -m compileall -q tools fixtures
      - run: python3 fixtures/tiny_training/generate.py --check
      - run: cd fixtures/tiny_training && python3 -m unittest test_fixture.py
      - run: cd fixtures/protocol && python3 -m unittest test_canonical.py
      - run: git diff --check
      - run: make -C engine/colibri check

  control-plane-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane-web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: apps/control-plane-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
