name: Bug report
description: Report a reproducible MojoColib defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not report security vulnerabilities here; use the private process in SECURITY.md."
  - type: textarea
    id: outcome
    attributes:
      label: What happened?
      description: Include the expected and observed result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal commands or inputs with all secrets and private data removed.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: MojoColib commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Hardware and runtime
      description: OS, CPU/GPU, memory, storage, drivers and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
