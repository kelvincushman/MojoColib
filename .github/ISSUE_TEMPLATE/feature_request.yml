name: Feature proposal
description: Propose a measured capability or research experiment
title: "[Proposal]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or research problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the smallest useful result and how it would be verified.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Trust, hardware and licensing impact
      description: Note new runtimes, dependencies, assets, data or hardware assumptions.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
