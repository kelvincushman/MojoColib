[workspace]
members = [
    "crates/artifact-client",
    "crates/coordinator-core",
    "crates/local-worker",
    "crates/protocol",
    "crates/scheduler",
    "crates/simulator",
    "crates/state-machine",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
version = "0.1.0"
publish = false
license = "Apache-2.0"
repository = "https://github.com/kelvincushman/MojoColib"
homepage = "https://github.com/kelvincushman/MojoColib"

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
proptest = "1.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
